name: Python Tests



on:
  push:
    branches:
      - GitHub_Actions

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests two separate times
        continue-on-error: true
        # Переменная подставится в систему и os.getenv() её успешно прочитает!
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          pytest test/test_Lesson_07_Booker -v
          echo -e "\n=== Ждем 5 секунд между запусками для обновления данных ===\n"
          sleep 5
          pytest test/test_Lesson_07_Booker -v

      - name: Run stable automation tests

        run:
          pytest test/test_Lesson_08_Booker -v